name: Cypress BDD Tests & Reporting

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  e2e-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare Database & Start Server
        run: |
          python manage.py migrate
          python manage.py loaddata books_fixture.json
          python manage.py runserver 8000 &

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Node Dependencies
        run: npm ci

      - name: Wait for Django Server
        run: npx wait-on http://127.0.0.1:8000

      # Cypress test execution step
      - name: Run Cypress BDD Tests
        id: cypress
        run: npm run cy:run

      - name: Generate Mochawesome HTML Report
        if: always()
        run: npm run report

      - name: Upload Test Artifacts (Reports, Screenshots, Videos)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cypress-test-artifacts
          path: |
            cypress/reports/
            cypress/screenshots/
            cypress/videos/
          if-no-files-found: ignore

      # --- AUTOMATED JIRA DEFECT REPORTING ---
      - name: Process AFT Jira issues
        if: always()
        env:
          AFT_ENABLED: ${{ secrets.JIRA_BASE_URL != '' && secrets.JIRA_USER_EMAIL != '' && secrets.JIRA_API_TOKEN != '' }}
          AFT_RECOVERY_ISSUE_KEYS: BSQA-26
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_PROJECT: BSQA
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$AFT_ENABLED" != "true" ]; then
            echo "AFT Jira integration is not configured; skipping."
            exit 0
          fi
          npm run aft:process